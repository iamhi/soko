<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Vault</title>
    <meta name="description" content="Local Markdown Vault">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effect"></div>
    <div class="container">
        <header>
            <h1>Markdown Vault</h1>
            <p class="subtitle">Secure Local Storage</p>
        </header>

        <main>
            <section class="glass-panel text-section">
                <h2>Create from Text</h2>
                <form id="text-form">
                    <div class="input-wrapper">
                        <input type="text" id="text-filename" placeholder="Filename (e.g., notes.md)">
                    </div>
                    <div class="input-wrapper">
                        <textarea id="text-content" placeholder="Paste your markdown content here..." rows="8" required></textarea>
                    </div>
                    <button type="submit" class="btn primary-btn" id="text-btn">Create & Store</button>
                    <div id="text-status" class="status-msg"></div>
                </form>
            </section>

            <section class="glass-panel upload-section">
                <h2>Ingest Document</h2>
                <form id="upload-form">
                    <div class="file-input-wrapper">
                        <input type="file" id="file-input" accept=".md" required>
                        <label for="file-input" class="file-label">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <span>Choose a Markdown File</span>
                        </label>
                    </div>
                    <button type="submit" class="btn primary-btn" id="upload-btn">Upload to Vault</button>
                    <div id="upload-status" class="status-msg"></div>
                </form>
            </section>

            <section class="glass-panel search-section">
                <h2>Semantic Search</h2>
                <form id="search-form">
                    <div class="input-wrapper">
                        <input type="text" id="search-query" placeholder="Ask a question or search concepts..." required>
                    </div>
                    <button type="submit" class="btn primary-btn" id="search-btn">Search Vault</button>
                    <div id="search-status" class="status-msg"></div>
                </form>
                <div id="search-results" class="results-container"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
